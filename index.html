<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מגזין לימור - מהדורת קלפי חוזקה</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --magazine-purple: #803080; }
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #f7f3f0; 
            color: #2d2d2d;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            /* שימוש ב-dvh להתאמה מושלמת לסרגלי הכלים של אנדרואיד */
            height: 100vh;
            height: 100dvh;
        }
        .serif-font { font-family: 'Playfair Display', serif; }
        
        .stack-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magazine-card { 
            aspect-ratio: 9 / 16; 
            background-color: white;
            /* מבטיח שהכרטיסייה לעולם לא תצא מגבולות המסך */
            max-height: 100%;
            width: auto;
            position: absolute;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .paper-texture {
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            opacity: 0.05;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const GITHUB_USER = "EfratAviran"; 
        const GITHUB_REPO = "L-"; 
        const IMG_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/`;

        // רשימת התמונות המעודכנת - מ-card0 עד card7
        const ALL_IMAGES = [
            "card0.png", // שער
            "card1.png",
            "card2.png",
            "card3.png",
            "card4.png",
            "card5.png",
            "card6.png",
            "card7.png"  // סיום
        ];

        function App() {
            const motion = window.Motion?.motion || window.FramerMotion?.motion || null;
            const AnimatePresence = window.Motion?.AnimatePresence || window.FramerMotion?.AnimatePresence || React.Fragment;

            const [currentIndex, setCurrentIndex] = useState(0);
            const [isAnimating, setIsAnimating] = useState(false);

            if (!motion) return null;

            const nextStep = () => {
                if (isAnimating || currentIndex >= ALL_IMAGES.length - 1) return;
                setIsAnimating(true);
                setCurrentIndex(prev => prev + 1);
                setTimeout(() => setIsAnimating(false), 600);
            };

            const restart = () => {
                setCurrentIndex(0);
            };

            return (
                <div className="h-screen h-[100dvh] flex flex-col items-center p-0 bg-[#f7f3f0] overflow-hidden text-center">
                    
                    {/* כותרת עליונה - קומפקטית */}
                    <header className="w-full max-w-lg mt-2 border-y border-[#803080] py-1 md:py-2 relative shrink-0">
                        <h1 className="serif-font text-xl md:text-3xl font-black text-[#803080] uppercase tracking-tight">
                            לימור חוגגת יומולדת
                        </h1>
                    </header>

                    {/* אזור הדפדוף - גמיש (min-h-0 חשוב כדי לאפשר לכלי להתכווץ) */}
                    <main className="flex-1 min-h-0 w-full max-w-md flex flex-col items-center justify-center relative overflow-hidden py-2 md:py-4 px-6">
                        <div className="stack-container">
                            <AnimatePresence>
                                {ALL_IMAGES.map((img, index) => {
                                    if (index < currentIndex || index > currentIndex + 1) return null;

                                    return (
                                        <motion.div
                                            key={img}
                                            initial={{ scale: 0.9, opacity: 0 }}
                                            animate={{ 
                                                scale: index === currentIndex ? 1 : 0.95,
                                                opacity: 1,
                                                zIndex: ALL_IMAGES.length - index
                                            }}
                                            exit={{ 
                                                x: -500, 
                                                rotate: -15, 
                                                opacity: 0,
                                                transition: { duration: 0.6, ease: "circIn" }
                                            }}
                                            className="magazine-card"
                                        >
                                            <img 
                                                src={`${IMG_BASE}${img}`} 
                                                className="w-full h-full object-contain"
                                                onError={(e) => { e.target.src = "https://via.placeholder.com/800x1400/803080/ffffff?text=LIMOR"; }}
                                            />
                                            <div className="paper-texture"></div>
                                        </motion.div>
                                    );
                                }).reverse()}
                            </AnimatePresence>
                        </div>
                    </main>

                    {/* כפתורים תחתונים - תמיד גלויים (shrink-0) */}
                    <footer className="w-full max-w-xs mb-4 md:mb-6 space-y-2 shrink-0 px-4">
                        {currentIndex < ALL_IMAGES.length - 1 ? (
                            <button
                                onClick={nextStep}
                                disabled={isAnimating}
                                className={`w-full text-white py-3 rounded-sm font-bold tracking-widest shadow-lg transition-all text-xs md:text-sm active:scale-95 ${isAnimating ? 'bg-stone-400' : 'bg-[#803080] hover:bg-[#6a276a]'}`}
                            >
                                {currentIndex === 0 ? "לפתיחת המגזין" : "להפוך דף"}
                            </button>
                        ) : (
                            <div className="flex flex-col items-center gap-2">
                                <span className="text-[#803080] font-bold text-[10px] uppercase tracking-tighter opacity-60">סוף הגיליון</span>
                                <button 
                                    onClick={restart} 
                                    className="w-auto text-[12px] md:text-sm font-bold text-white bg-[#803080] py-2.5 px-10 rounded-full shadow-md uppercase tracking-widest hover:bg-[#6a276a] transition-all transform active:scale-95 border border-white/20"
                                >
                                    חזרה לשער
                                </button>
                            </div>
                        )}
                        
                        {currentIndex > 0 && currentIndex < ALL_IMAGES.length - 1 && (
                            <button 
                                onClick={restart} 
                                className="text-[10px] text-stone-400 uppercase tracking-tighter hover:text-[#803080] transition-colors py-1"
                            >
                                התחלה מחדש
                            </button>
                        )}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
